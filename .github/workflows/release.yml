name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tests
        run: go test -count=1 ./...

      - name: Build (windows + linux + darwin)
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/serve-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/serve-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o dist/serve-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o dist/serve-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o dist/serve-darwin-arm64 .
          ls -la dist/

      - name: Release (tags) o artifacts (manual)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

      - name: Subir artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: serve-go-binaries
          path: dist/*
